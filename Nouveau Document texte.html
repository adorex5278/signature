<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF reconstitué (12x12 tiles)</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      height: 100vh;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 1fr);
      width: 524px;   /* largeur totale du GIF original */
      height: 393px;  /* hauteur totale du GIF original */
      overflow: hidden;
    }

    .gif-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      margin: 0;
      padding: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gif-grid">
